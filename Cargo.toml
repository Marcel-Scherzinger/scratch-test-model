[package]
name = "scratch-test-model"
version = "0.1.0"
edition = "2024"

[dependencies.smodel]
git = "https://github.com/marcel-scherzinger/bast3st-scratch"
package = "scratch-test-model"
default-features = false

[features]
default = ["sb3"]
sb3 = [ "smodel/sb3" ]
thread-share = ["smodel/thread-share"]
serde = ["smodel/serde"]
schemars = ["smodel/schemars"]
utoipa = ["smodel/utoipa"]
